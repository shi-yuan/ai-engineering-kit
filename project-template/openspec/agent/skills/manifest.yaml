schema: ai-engineering-kit.skills.v1
kit_version: 1.2.0
skills:
  - name: brownfield-analysis
    entry: brownfield-analysis/SKILL.md
    description: 历史系统修改前，还原真实系统现状和影响范围。
    phase: analysis
    modifies_code: false
  - name: design-review
    entry: design-review/SKILL.md
    description: 实现前审查 OpenSpec Proposal、Specs、Design 和 Tasks。
    phase: review
    modifies_code: false
  - name: verification
    entry: verification/SKILL.md
    description: 验证实际实现是否覆盖需求、符合设计并完成必要工程验证。
    phase: verification
    modifies_code: false
  - name: api-verification
    entry: api-verification/SKILL.md
    description: Swagger/OpenAPI 驱动的接口实测骨架（契约比对 + .http 用例生成执行 + 报告）。项目须在 custom-skills 提供同名实例登记适配点（服务地址/鉴权/统一响应/测试数据），实例优先覆盖。
    phase: verification
    modifies_code: false
  - name: change-review
    entry: change-review/SKILL.md
    description: 基于所有相关仓库实际 Diff 做最终工程审查。
    phase: review
    modifies_code: false
  - name: code-review
    entry: code-review/SKILL.md
    description: 通用代码审查骨架（人工 Code Review 节点执行主体：需求覆盖矩阵 + Bug/性能清单）。项目 custom-skills 同名 Skill 优先覆盖。
    phase: review
    modifies_code: false
  - name: sql-review
    entry: sql-review/SKILL.md
    description: 通用 DDL 审查骨架（人工 Code Review 的 DDL 条件子项：命名/禁用项/迁移风险）。项目 custom-skills 同名 Skill 优先覆盖。
    phase: review
    modifies_code: false
  - name: context-sync
    entry: context-sync/SKILL.md
    description: 将已确认的长期系统事实和工程约束同步到 project-context 与 rules。
    phase: context-sync
    modifies_code: false
